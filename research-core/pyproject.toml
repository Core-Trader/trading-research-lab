[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-research-core"
version = "0.0.1"
description = "Deterministic, local calculation authority for Trading Research Lab."
requires-python = ">=3.14,<3.15"
dependencies = [
    "openpyxl>=3.1.5,<4",
    "pyarrow>=25.0.1,<26",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10",
]

[project.scripts]
trl-core = "trading_research_core.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]
